
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked Members | Mubeezi Dating</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fff5f7;
      color: #333;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #e91e63, #c2185b);
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 7px;
    }

    header p {
      font-size: 14px;
    }

    .container {
      max-width: 750px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #c2185b;
      text-decoration: none;
      font-weight: bold;
    }

    .info {
      background: white;
      border-left: 4px solid #e91e63;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      line-height: 1.6;
      font-size: 14px;
    }

    .member-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .member-photo {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      background: #fce4ec;
      flex-shrink: 0;
    }

    .member-details {
      flex: 1;
      min-width: 0;
    }

    .member-details h3 {
      color: #c2185b;
      font-size: 17px;
      margin-bottom: 5px;
      overflow-wrap: anywhere;
    }

    .member-details p {
      color: #777;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    button {
      background: #e91e63;
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #c2185b;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      padding: 25px 15px;
      color: #777;
      line-height: 1.6;
    }

    .error {
      color: #c62828;
    }

    @media (max-width: 520px) {
      .member-card {
        flex-wrap: wrap;
      }

      .member-details {
        min-width: calc(100% - 95px);
      }

      .member-card button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Mubeezi Dating</h1>
    <p>Connecting Hearts Worldwide</p>
  </header>

  <main class="container">

    <a href="settings.html" class="back-link">← Back to Settings</a>

    <h2 style="margin-bottom:15px;">Blocked Members</h2>

    <div class="info">
      People you block cannot view your profile, message you, like you,
      or interact with you through Mubeezi Dating. They are not notified
      when you block or unblock them.
    </div>

    <div id="blockedList">
      <div class="status">Loading your blocked members...</div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = "https://xxtlcdvuiyrdufzvzeob.supabase.co";
    const SUPABASE_KEY = "sb_publishable_KOs2uLOuyzOVLhg9H5gJJw_1pUYvlsU";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const blockedList = document.getElementById("blockedList");

    let currentUser = null;

    async function initializePage() {
      const { data, error } = await supabaseClient.auth.getUser();

      if (error || !data.user) {
        window.location.href = "login.html";
        return;
      }

      currentUser = data.user;
      await loadBlockedMembers();
    }

    async function loadBlockedMembers() {
      blockedList.innerHTML =
        '<div class="status">Loading your blocked members...</div>';

      const { data: blocks, error } = await supabaseClient
        .from("blocked_members")
        .select("id, blocked_id, created_at")
        .eq("blocker_id", currentUser.id)
        .order("created_at", { ascending: false });

      if (error) {
        console.error("Blocked members error:", error);

        blockedList.innerHTML = `
          <div class="status error">
            Could not load your blocked members.<br>
            Please check that the blocked_members table and its
            access policies have been created.
          </div>
        `;
        return;
      }

      if (!blocks || blocks.length === 0) {
        blockedList.innerHTML = `
          <div class="status">
            <h3>You have no blocked members</h3>
            <p>Members you block will appear here.</p>
          </div>
        `;
        return;
      }

      const blockedIds = blocks.map(item => item.blocked_id);

      const { data: profiles, error: profileError } = await supabaseClient
        .from("profiles")
        .select("id, display_name, full_name, profile_photo, country")
        .in("id", blockedIds);

      if (profileError) {
        console.warn("Some profile details could not be loaded:", profileError);
      }

      const profileMap = {};

      (profiles || []).forEach(profile => {
        profileMap[profile.id] = profile;
      });

      blockedList.innerHTML = "";

      blocks.forEach(block => {
        const profile = profileMap[block.blocked_id];

        const name = profile
          ? (profile.display_name || profile.full_name || "Mubeezi Member")
          : "Blocked Member";

        const country = profile && profile.country
          ? profile.country
          : "Profile details unavailable";

        const photo = profile && profile.profile_photo
          ? profile.profile_photo
          : "https://placehold.co/100x100/fce4ec/c2185b?text=Member";

        const card = document.createElement("div");
        card.className = "member-card";

        const image = document.createElement("img");
        image.className = "member-photo";
        image.src = photo;
        image.alt = "Member profile photo";
        image.onerror = function() {
          this.src = "https://placehold.co/100x100/fce4ec/c2185b?text=Member";
        };

        const details = document.createElement("div");
        details.className = "member-details";

        const heading = document.createElement("h3");
        heading.textContent = name;

        const countryText = document.createElement("p");
        countryText.textContent = country;

        details.appendChild(heading);
        details.appendChild(countryText);

        const unblockButton = document.createElement("button");
        unblockButton.textContent = "Unblock";
        unblockButton.addEventListener("click", () => {
          unblockMember(block.id, unblockButton);
        });

        card.appendChild(image);
        card.appendChild(details);
        card.appendChild(unblockButton);

        blockedList.appendChild(card);
      });
    }

    async function unblockMember(blockId, button) {
      const confirmed = confirm(
        "Are you sure you want to unblock this member?"
      );

      if (!confirmed) return;

      button.disabled = true;
      button.textContent = "Unblocking...";

      const { error } = await supabaseClient
        .from("blocked_members")
        .delete()
        .eq("id", blockId)
        .eq("blocker_id", currentUser.id);

      if (error) {
        console.error("Unblock error:", error);
        alert("Could not unblock this member. Please try again.");
        button.disabled = false;
        button.textContent = "Unblock";
        return;
      }

      alert("Member successfully unblocked.");
      await loadBlockedMembers();
    }

    initializePage();
  </script>

</body>
</html>
