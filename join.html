<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e91e63">
  <title>Login | Mubeezi Dating</title>
  <style>
    :root{--red:#e91e63;--deep:#c2185b;--pink:#fff0f5;--ink:#29232a;--muted:#77717a;--line:#eee5e9}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,Helvetica,sans-serif;min-height:100vh;background:linear-gradient(145deg,#fff7fa,#fff 55%,#ffeaf2);color:var(--ink);display:flex;flex-direction:column}
    a{color:var(--red);text-decoration:none}
    header{background:#fff;border-bottom:1px solid var(--line)}
    .topbar{width:min(1100px,92%);min-height:70px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .logo{font-size:23px;font-weight:900;color:var(--red);letter-spacing:-.5px}
    .logo span{color:var(--ink)}
    .home-link{font-size:14px;font-weight:700}
    main{flex:1;display:grid;place-items:center;padding:38px 16px}
    .login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 18px 55px #5b17300e}
    .heart{width:58px;height:58px;border-radius:18px;background:var(--pink);display:grid;place-items:center;color:var(--red);font-size:30px;margin-bottom:18px}
    h1{font-size:29px;letter-spacing:-.6px;margin-bottom:7px}
    .intro{font-size:14px;color:var(--muted);margin-bottom:25px}
    .field{margin-bottom:17px}
    label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
    input{width:100%;height:48px;border:1px solid #ded5da;border-radius:11px;padding:0 13px;font-size:15px;color:var(--ink);outline:none;background:#fff}
    input:focus{border-color:var(--red);box-shadow:0 0 0 3px #e91e6318}
    .password-wrap{position:relative}
    .password-wrap input{padding-right:75px}
    .show-password{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--red);font-size:12px;font-weight:700;cursor:pointer;padding:8px}
    .forgot-row{display:flex;justify-content:flex-end;margin:-4px 0 18px;font-size:13px;font-weight:700}
    .submit{width:100%;height:49px;border:0;border-radius:25px;background:var(--red);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
    .submit:hover{background:var(--deep)}
    .submit:disabled{opacity:.65;cursor:wait}
    .message{display:none;padding:11px 12px;border-radius:10px;font-size:13px;margin:0 0 16px;line-height:1.45}
    .message.error{display:block;background:#fff0f0;color:#a51d2d;border:1px solid #ffd3d7}
    .message.success{display:block;background:#edfff4;color:#176b3a;border:1px solid #c8f0d6}
    .bottom-text{text-align:center;color:var(--muted);font-size:14px;margin-top:22px}
    footer{text-align:center;padding:20px;color:var(--muted);font-size:12px}
    @media(max-width:480px){.login-card{padding:26px 21px}h1{font-size:26px}.topbar{min-height:62px}.logo{font-size:20px}}
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <a class="logo" href="home.html">MUBEEZI <span>DATING</span></a>
      <a class="home-link" href="home.html">Back to home</a>
    </div>
  </header>

  <main>
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="heart" aria-hidden="true">♥</div>
      <h1 id="loginTitle">Welcome back</h1>
      <p class="intro">Log in to Mubeezi Dating with your email address and password.</p>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button class="show-password" type="button" id="togglePassword">Show</button>
          </div>
        </div>

        <div class="forgot-row"><a href="#" id="forgotPassword">Forgot password?</a></div>
        <button class="submit" id="loginButton" type="submit">Log in</button>
      </form>

      <p class="bottom-text">Don't have an account? <a href="register.html"><strong>Join Mubeezi Dating</strong></a></p>
    </section>
  </main>

  <footer>© <span id="year"></span> Mubeezi Dating · Connecting Hearts Worldwide</footer>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://xxtlcdvuiyrdufzvzeob.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_KOs2uLOuyzOVLhg9H5gJJw_1pUYvlsU";
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const messageBox = document.getElementById("message");
    document.getElementById("year").textContent = new Date().getFullYear();

    function showMessage(text, type = "error") {
      messageBox.textContent = text;
      messageBox.className = "message " + type;
    }

    function destinationAfterLogin() {
      const requested = new URLSearchParams(location.search).get("next");
      // Only allow a local page path; do not redirect to an external website.
      if (requested && requested.startsWith("/") && !requested.startsWith("//")) {
        return requested;
      }
      if (requested && /^[a-zA-Z0-9._-]+\.html(?:[?#].*)?$/.test(requested)) {
        return requested;
      }
      return "home.html";
    }

    document.getElementById("togglePassword").addEventListener("click", () => {
      const show = passwordInput.type === "password";
      passwordInput.type = show ? "text" : "password";
      document.getElementById("togglePassword").textContent = show ? "Hide" : "Show";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      messageBox.className = "message";
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("Enter your email address and password.");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Logging in…";

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        showMessage(error.message || "Login failed. Check your email and password.");
        loginButton.disabled = false;
        loginButton.textContent = "Log in";
        return;
      }

      if (!data.user) {
        showMessage("We couldn't confirm your account. Please try again.");
        loginButton.disabled = false;
        loginButton.textContent = "Log in";
        return;
      }

      showMessage("Login successful. Opening your account…", "success");
      location.href = destinationAfterLogin();
    });

    document.getElementById("forgotPassword").addEventListener("click", async (event) => {
      event.preventDefault();
      const email = emailInput.value.trim();
      if (!email) {
        showMessage("Enter your email address first, then select Forgot password.");
        emailInput.focus();
        return;
      }

      const link = event.currentTarget;
      link.style.pointerEvents = "none";
      link.textContent = "Sending…";
      const { error } = await supabase.auth.resetPasswordForEmail(email);
      link.style.pointerEvents = "";
      link.textContent = "Forgot password?";

      if (error) {
        showMessage(error.message || "We couldn't send the password reset email.");
      } else {
        showMessage("If an account exists for this email, a password reset email has been sent. Check your inbox and spam folder.", "success");
      }
    });
  </script>
</body>
</html>
