
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages | Mubeezi Dating</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff5f7;color:#333}
header{background:#e91e63;color:white;padding:18px;text-align:center}
header h1{margin:0}
header p{margin:6px 0 0}
nav{background:white;padding:12px;text-align:center;box-shadow:0 2px 6px #ddd}
nav a{display:inline-block;margin:5px 9px;color:#d81b60;text-decoration:none;font-weight:bold;font-size:14px}
.container{max-width:850px;margin:22px auto;padding:12px}
.panel{background:white;border-radius:13px;box-shadow:0 3px 12px #00000012;overflow:hidden}
.top{padding:17px;border-bottom:1px solid #eee}
.top h2{margin:0;color:#c2185b}
#conversationTitle{margin-top:7px;color:#777;font-size:14px}
#chat{height:440px;overflow-y:auto;padding:18px;background:#fffafd}
.bubble{max-width:78%;padding:11px 14px;margin:10px 0;border-radius:15px;overflow-wrap:anywhere}
.sent{background:#f8bbd0;margin-left:auto;border-bottom-right-radius:4px}
.received{background:#f1f1f1;margin-right:auto;border-bottom-left-radius:4px}
.time{display:block;font-size:10px;color:#777;margin-top:6px;text-align:right}
.composer{display:flex;gap:9px;padding:14px;border-top:1px solid #eee}
textarea{flex:1;resize:none;min-height:45px;max-height:120px;border:1px solid #ddd;border-radius:12px;padding:12px;font-family:inherit}
button{border:0;border-radius:22px;padding:0 22px;background:#e91e63;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.status{padding:16px;text-align:center;color:#777}
.error{color:#c62828}
@media(max-width:500px){#chat{height:60vh}.composer{padding:10px}button{padding:0 15px}}
</style>
</head>

<body>

<header>
<h1>❤️ Mubeezi Dating</h1>
<p>Connecting Hearts Worldwide</p>
</header>

<nav>
<a href="home.html">Home</a>
<a href="discover.html">Discover</a>
<a href="likes.html">Likes</a>
<a href="matches.html">Matches</a>
<a href="messages.html">Messages</a>
<a href="my-profile.html">My Profile</a>
</nav>

<div class="container">
<div class="panel">

<div class="top">
<h2>💬 Messages</h2>
<div id="conversationTitle">Choose a member to start a conversation.</div>
</div>

<div id="status" class="status">Loading messages...</div>
<div id="chat"></div>

<form id="messageForm" class="composer">
<textarea id="messageInput" placeholder="Write your message..." maxlength="5000" required></textarea>
<button id="sendButton" type="submit">Send</button>
</form>

</div>
</div>

<script>
const SUPABASE_URL = "https://xxtlcdvuiyrdufzvzeob.supabase.co";
const SUPABASE_KEY = "sb_publishable_KOs2uLOuyzOVLhg9H5gJJw_1pUYvlsU";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const statusBox = document.getElementById("status");
const chatBox = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const titleBox = document.getElementById("conversationTitle");

let currentUser = null;
let otherUserId = new URLSearchParams(location.search).get("user");
let otherUserName = "Member";
let refreshTimer = null;

function showStatus(message, error = false) {
    statusBox.textContent = message;
    statusBox.className = error ? "status error" : "status";
    statusBox.style.display = "block";
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    })[char]);
}

function formatTime(value) {
    if (!value) return "";
    return new Date(value).toLocaleString();
}

async function loadConversation() {
    if (!otherUserId) {
        showStatus("Open a member's profile and select Message to start a conversation.");
        input.disabled = true;
        sendButton.disabled = true;
        return;
    }

    try {
        const { data: profile, error: profileError } = await db
            .from("profiles")
            .select("display_name,full_name")
            .eq("id", otherUserId)
            .maybeSingle();

        if (profileError) throw profileError;

        otherUserName = profile?.display_name || profile?.full_name || "Member";
        titleBox.textContent = "Conversation with " + otherUserName;

        const { data: messages, error } = await db
            .from("messages")
            .select("id,sender_id,recipient_id,content,created_at")
            .or(
                `and(sender_id.eq.${currentUser.id},recipient_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},recipient_id.eq.${currentUser.id})`
            )
            .order("created_at", { ascending: true });

        if (error) throw error;

        chatBox.innerHTML = "";

        if (!messages || messages.length === 0) {
            showStatus("No messages yet. Say hello! ❤️");
            return;
        }

        statusBox.style.display = "none";

        messages.forEach(message => {
            const isMine = message.sender_id === currentUser.id;
            const bubble = document.createElement("div");
            bubble.className = "bubble " + (isMine ? "sent" : "received");

            bubble.innerHTML = `
                ${escapeHTML(message.content)}
                <span class="time">${escapeHTML(formatTime(message.created_at))}</span>
            `;

            chatBox.appendChild(bubble);
        });

        chatBox.scrollTop = chatBox.scrollHeight;

    } catch (error) {
        console.error("Message loading error:", error);
        showStatus(
            "We couldn't load this conversation. Check that the messages table and its permissions are configured.",
            true
        );
    }
}

document.getElementById("messageForm").addEventListener("submit", async event => {
    event.preventDefault();

    const content = input.value.trim();

    if (!content || !currentUser || !otherUserId) return;

    sendButton.disabled = true;

    try {
        const { error } = await db
            .from("messages")
            .insert({
                sender_id: currentUser.id,
                recipient_id: otherUserId,
                content: content
            });

        if (error) throw error;

        input.value = "";
        await loadConversation();

    } catch (error) {
        console.error("Message sending error:", error);
        showStatus("Your message could not be sent. Please check your message permissions.", true);
    } finally {
        sendButton.disabled = false;
    }
});

async function start() {
    try {
        const { data, error } = await db.auth.getSession();
        if (error) throw error;

        currentUser = data.session?.user;

        if (!currentUser) {
            location.href = "login.html";
            return;
        }

        if (otherUserId === currentUser.id) {
            showStatus("You cannot start a conversation with yourself.", true);
            input.disabled = true;
            sendButton.disabled = true;
            return;
        }

        await loadConversation();

        refreshTimer = setInterval(loadConversation, 10000);

    } catch (error) {
        console.error(error);
        showStatus("Unable to open messages. Please sign in again.", true);
    }
}

window.addEventListener("beforeunload", () => {
    if (refreshTimer) clearInterval(refreshTimer);
});

start();
</script>

</body>
</html>
