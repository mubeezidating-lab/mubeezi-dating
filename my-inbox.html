<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d71945">
<title>My Inbox | Mubeezi Dating</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff5f7;color:#29242a}
header{background:#d71945;color:#fff;padding:20px 14px;text-align:center}
header h1{margin:0;font-size:25px}
header p{margin:5px 0 0;font-size:13px}
nav{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:12px;background:#fff;box-shadow:0 2px 8px #0000000d}
nav a{color:#d71945;text-decoration:none;font-weight:bold;font-size:13px;padding:7px 10px}
.container{width:min(760px,94%);margin:25px auto}
.heading{text-align:center;margin-bottom:20px}
.heading h2{color:#d71945;margin:0 0 5px}
.heading p{color:#777;font-size:14px}
.search{width:100%;padding:13px 15px;border:1px solid #f0dce3;border-radius:25px;font-size:15px;outline:none;margin-bottom:15px}
.search:focus{border-color:#d71945}
.status{background:#fff;padding:22px;border-radius:13px;text-align:center;color:#777;margin:12px 0}
.status.error{color:#b42318}
.chat-list{display:grid;gap:10px}
.chat{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid #f0e2e6;border-radius:15px;padding:13px;text-decoration:none;color:inherit;box-shadow:0 3px 12px #54152a09;transition:.15s}
.chat:hover{border-color:#f1a9c0;transform:translateY(-1px)}
.avatar{width:58px;height:58px;flex:0 0 58px;border-radius:50%;overflow:hidden;background:#ffe1eb;display:grid;place-items:center;color:#d71945;font-size:23px;font-weight:bold;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
.chat-main{min-width:0;flex:1}
.chat-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chat-name{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-date{font-size:11px;color:#999;white-space:nowrap}
.chat-preview{font-size:13px;color:#777;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-preview.unread{font-weight:700;color:#393039}
.chat-presence{display:flex;align-items:center;gap:5px;margin-top:5px;color:#888;font-size:11px}
.presence-dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;display:inline-block;flex:0 0 8px}
.presence-dot.online{background:#16a34a;box-shadow:0 0 0 3px #16a34a20}
.unread-badge{min-width:21px;height:21px;padding:0 6px;border-radius:20px;background:#e91e63;color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-left:8px}
footer{text-align:center;color:#888;font-size:12px;padding:25px 10px}
@media(max-width:420px){.container{margin:18px auto}.chat{padding:11px;gap:10px}.avatar{width:50px;height:50px;flex-basis:50px}.chat-name{font-size:14px}.chat-date{font-size:10px}}
</style>
</head>
<body>
<header><h1>❤️ Mubeezi Dating</h1><p>Connecting Hearts Worldwide</p></header>
<nav aria-label="Main navigation">
<a href="home.html">Home</a><a href="discover.html">Discover</a><a href="likes.html">Likes</a><a href="matches.html">Matches</a><a href="notifications.html">Notifications</a><a href="my-profile.html">My Profile</a>
</nav>
<main class="container">
  <div class="heading"><h2>💌 My Inbox</h2><p>Select a conversation to continue chatting.</p></div>
  <input id="searchChats" class="search" type="search" placeholder="Search your conversations..." aria-label="Search conversations">
  <div id="status" class="status">Loading your conversations...</div>
  <div id="chatList" class="chat-list"></div>
</main>
<footer>© <span id="year"></span> Mubeezi Dating</footer>
<script>
const SUPABASE_URL="https://xxtlcdvuiyrdufzvzeob.supabase.co";
const SUPABASE_KEY="sb_publishable_KOs2uLOuyzOVLhg9H5gJJw_1pUYvlsU";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const statusBox=document.getElementById("status");
const chatList=document.getElementById("chatList");
let currentUser=null, allChats=[], realtimeChannel=null, presenceChannel=null, refreshTimer=null, presenceTimer=null;
const ONLINE_WINDOW_MS=90000;

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function showStatus(msg,error=false){statusBox.textContent=msg;statusBox.className=error?"status error":"status";statusBox.hidden=false;}
function dateLabel(v){if(!v)return "";const d=new Date(v);if(Number.isNaN(d.getTime()))return "";return d.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}
function otherMemberId(m){return m.sender_id===currentUser.id?m.recipient_id:m.sender_id;}
function presenceLabel(lastSeen){
  if(!lastSeen)return "Offline";
  const age=Date.now()-new Date(lastSeen).getTime();
  if(!Number.isFinite(age))return "Offline";
  if(age<=ONLINE_WINDOW_MS)return "Online";
  const mins=Math.max(1,Math.floor(age/60000));
  if(mins<60)return "Last seen "+mins+(mins===1?" minute ago":" minutes ago");
  const hours=Math.floor(mins/60);
  if(hours<24)return "Last seen "+hours+(hours===1?" hour ago":" hours ago");
  const days=Math.floor(hours/24);
  return "Last seen "+days+(days===1?" day ago":" days ago");
}

async function loadChats(){
  const {data:messages,error}=await db.from("messages")
    .select("id,sender_id,recipient_id,content,created_at,is_read")
    .or(`sender_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id}`)
    .order("created_at",{ascending:false}).limit(1000);
  if(error)throw error;
  const latestByMember=new Map();
  for(const message of (messages||[])){
    const otherId=otherMemberId(message);
    if(!otherId||otherId===currentUser.id)continue;
    if(!latestByMember.has(otherId))latestByMember.set(otherId,{otherId,last:message,unread:0});
    if(message.recipient_id===currentUser.id&&message.is_read===false)latestByMember.get(otherId).unread++;
  }
  const ids=[...latestByMember.keys()];
  let profiles=[],presenceRows=[];
  if(ids.length){
    const [{data:profileData,error:profileError},{data:presenceData,error:presenceError}]=await Promise.all([
      db.from("profiles").select("id,display_name,full_name,username,country,profile_photo").in("id",ids),
      db.from("member_presence").select("user_id,last_seen").in("user_id",ids)
    ]);
    if(profileError)console.warn("Could not load inbox profile details:",profileError);
    if(presenceError)console.warn("Could not load online status:",presenceError);
    profiles=profileData||[];presenceRows=presenceData||[];
  }
  const profileMap=new Map(profiles.map(p=>[p.id,p]));
  const presenceMap=new Map(presenceRows.map(p=>[p.user_id,p.last_seen]));
  allChats=[...latestByMember.values()].map(item=>{
    const p=profileMap.get(item.otherId)||{};
    return {...item,profile:p,name:p.display_name||p.full_name||p.username||"Mubeezi Member",lastSeen:presenceMap.get(item.otherId)||null};
  });
  allChats.sort((a,b)=>new Date(b.last.created_at||0)-new Date(a.last.created_at||0));
  renderChats();
}

function renderChats(){
  const term=document.getElementById("searchChats").value.trim().toLowerCase();
  const filtered=allChats.filter(c=>(c.name+" "+(c.profile.country||"")).toLowerCase().includes(term));
  chatList.innerHTML="";
  if(!filtered.length){showStatus(allChats.length?"No conversations match your search.":"You don't have any conversations yet.");return;}
  statusBox.hidden=true;
  filtered.forEach(c=>{
    const a=document.createElement("a");a.className="chat";a.href="messages.html?user="+encodeURIComponent(c.otherId);
    const photo=c.profile.profile_photo;
    const initial=esc(c.name.trim().charAt(0).toUpperCase()||"M");
    const avatar=photo?`<img src="${esc(photo)}" alt="${esc(c.name)}" onerror="this.style.display='none';this.parentElement.textContent='${initial}'">`:initial;
    const preview=c.last.content||"Sent an attachment";
    const presence=presenceLabel(c.lastSeen);
    a.innerHTML=`<div class="avatar">${avatar}</div>
      <div class="chat-main">
        <div class="chat-top"><span class="chat-name">${esc(c.name)}</span><span class="chat-date">${esc(dateLabel(c.last.created_at))}</span></div>
        <div class="chat-preview ${c.unread?"unread":""}">${esc(preview)}</div>
        <div class="chat-presence"><span class="presence-dot ${presence==="Online"?"online":""}"></span><span>${esc(presence)}</span></div>
      </div>${c.unread?`<span class="unread-badge">${c.unread>99?"99+":c.unread}</span>`:""}`;
    chatList.appendChild(a);
  });
}

async function sendPresenceHeartbeat(){
  if(!currentUser)return;
  const {error}=await db.from("member_presence").upsert({user_id:currentUser.id,last_seen:new Date().toISOString()},{onConflict:"user_id"});
  if(error)console.warn("Presence heartbeat failed:",error.message);
}

async function start(){
  try{
    const {data,error}=await db.auth.getSession();if(error)throw error;
    currentUser=data.session?.user;
    if(!currentUser){location.href="login.html?next="+encodeURIComponent("inbox.html");return;}
    await sendPresenceHeartbeat();
    await loadChats();
    realtimeChannel=db.channel("inbox-list-"+currentUser.id)
      .on("postgres_changes",{event:"*",schema:"public",table:"messages",filter:"recipient_id=eq."+currentUser.id},()=>loadChats().catch(e=>showStatus("Could not refresh conversations: "+e.message,true)))
      .on("postgres_changes",{event:"*",schema:"public",table:"messages",filter:"sender_id=eq."+currentUser.id},()=>loadChats().catch(e=>showStatus("Could not refresh conversations: "+e.message,true)))
      .on("postgres_changes",{event:"*",schema:"public",table:"member_presence"},()=>loadChats().catch(console.warn))
      .subscribe();
    refreshTimer=window.setInterval(()=>loadChats().catch(e=>console.warn("Inbox refresh:",e)),15000);
    presenceTimer=window.setInterval(sendPresenceHeartbeat,30000);
  }catch(error){
    console.error("Inbox error:",error);
    showStatus("We couldn't load your inbox. Check the messages table, read-status column, member_presence table, and Supabase permissions. "+(error.message||""),true);
  }
}
document.getElementById("searchChats").addEventListener("input",renderChats);
document.getElementById("year").textContent=new Date().getFullYear();
window.addEventListener("beforeunload",()=>{if(refreshTimer)clearInterval(refreshTimer);if(presenceTimer)clearInterval(presenceTimer);if(realtimeChannel)db.removeChannel(realtimeChannel);if(presenceChannel)db.removeChannel(presenceChannel);});
start();
</script>
</body>
</html>
