
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications | Mubeezi Dating</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff5f7;color:#333}
header{background:#e91e63;color:white;padding:20px;text-align:center}
header h1{margin:0}
header p{margin:6px 0 0}
nav{background:white;padding:12px;text-align:center;box-shadow:0 2px 6px #ddd}
nav a{display:inline-block;margin:5px 9px;color:#d81b60;text-decoration:none;font-weight:bold;font-size:14px}
.container{max-width:850px;margin:25px auto;padding:15px}
.heading{text-align:center;margin-bottom:22px}
.heading h2{color:#d81b60}
.notification{background:white;padding:17px;margin-bottom:12px;border-radius:12px;box-shadow:0 2px 8px #0000000d;border-left:5px solid #e91e63}
.notification.unread{background:#fff0f5}
.notification h3{margin:0 0 7px;color:#c2185b;font-size:17px}
.notification p{margin:0;color:#555;line-height:1.5}
.notification small{display:block;margin-top:10px;color:#999}
.actions{text-align:right;margin-bottom:15px}
button{background:#e91e63;color:white;border:0;border-radius:20px;padding:10px 17px;cursor:pointer;font-weight:bold}
.status{text-align:center;background:white;padding:22px;border-radius:12px;color:#777}
.error{color:#c62828}
</style>
</head>

<body>

<header>
<h1>❤️ Mubeezi Dating</h1>
<p>Connecting Hearts Worldwide</p>
</header>

<nav>
<a href="home.html">Home</a>
<a href="discover.html">Discover</a>
<a href="likes.html">Likes</a>
<a href="matches.html">Matches</a>
<a href="messages.html">Messages</a>
<a href="my-profile.html">My Profile</a>
</nav>

<div class="container">

<div class="heading">
<h2>🔔 Notifications</h2>
<p>Stay updated on what's happening with your account.</p>
</div>

<div class="actions">
<button id="markAllButton" type="button">Mark all as read</button>
</div>

<div id="status" class="status">Loading notifications...</div>
<div id="notificationList"></div>

</div>

<script>
const SUPABASE_URL = "https://xxtlcdvuiyrdufzvzeob.supabase.co";
const SUPABASE_KEY = "sb_publishable_KOs2uLOuyzOVLhg9H5gJJw_1pUYvlsU";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const statusBox = document.getElementById("status");
const list = document.getElementById("notificationList");
const markAllButton = document.getElementById("markAllButton");

let currentUser = null;

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    })[char]);
}

function showStatus(message, error = false) {
    statusBox.textContent = message;
    statusBox.className = error ? "status error" : "status";
    statusBox.style.display = "block";
}

function formatDate(value) {
    if (!value) return "";
    return new Date(value).toLocaleString();
}

async function loadNotifications() {
    try {
        const { data, error } = await db
            .from("notifications")
            .select("id,user_id,title,body,type,is_read,created_at")
            .eq("user_id", currentUser.id)
            .order("created_at", { ascending: false });

        if (error) throw error;

        list.innerHTML = "";

        if (!data || data.length === 0) {
            showStatus("You don't have any notifications yet.");
            markAllButton.disabled = true;
            return;
        }

        statusBox.style.display = "none";
        markAllButton.disabled = false;

        data.forEach(notification => {
            const item = document.createElement("div");
            item.className = "notification " +
                (notification.is_read ? "" : "unread");

            item.innerHTML = `
                <h3>${escapeHTML(notification.title || "Mubeezi Dating")}</h3>
                <p>${escapeHTML(notification.body || "")}</p>
                <small>
                    ${escapeHTML(notification.type || "Update")}
                    · ${escapeHTML(formatDate(notification.created_at))}
                    ${notification.is_read ? " · Read" : " · Unread"}
                </small>
            `;

            list.appendChild(item);
        });

    } catch (error) {
        console.error("Notifications error:", error);
        showStatus(
            "We couldn't load your notifications. Check that the notifications table and permissions are configured.",
            true
        );
    }
}

markAllButton.addEventListener("click", async () => {
    markAllButton.disabled = true;

    try {
        const { error } = await db
            .from("notifications")
            .update({ is_read: true })
            .eq("user_id", currentUser.id)
            .eq("is_read", false);

        if (error) throw error;

        await loadNotifications();

    } catch (error) {
        console.error("Mark notifications read error:", error);
        showStatus("We couldn't update your notifications. Please try again.", true);
    } finally {
        markAllButton.disabled = false;
    }
});

async function start() {
    try {
        const { data, error } = await db.auth.getSession();
        if (error) throw error;

        currentUser = data.session?.user;

        if (!currentUser) {
            location.href = "login.html";
            return;
        }

        await loadNotifications();

    } catch (error) {
        console.error(error);
        showStatus("Please sign in to view your notifications.", true);
    }
}

start();
</script>

</body>
</html>
